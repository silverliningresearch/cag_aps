     <!-- Fallback Configuration System -->
  <script type="text/javascript">
    // Configuration for fallback system
    const CONFIG_URL = 'https://raw.githubusercontent.com/silverliningresearch/aptgateway/main/config.json?t=' + new Date().getTime();

    // Global variables to store config and data sources
    let gatewayConfig = null;
    let dataSourceBase = '';
    let requiresToken = false;
    let userToken = '';

    // Parse token from URL query parameter
    function getTokenFromURL() {
      const queryString = window.location.search;
      const urlParams = new URLSearchParams(queryString);
      return urlParams.get('token') || '';
    }

    // Get token on page load
    userToken = getTokenFromURL();

    if (userToken) {
      console.log('Token found in URL');
    } else {
      console.log('No token in URL - will use fallback mode if token is required');
    }

    // Fetch configuration and load data scripts
    async function loadConfiguration() {
      try {
        const response = await fetch(CONFIG_URL);
        gatewayConfig = await response.json();

        // Determine data source based on mode
        if (gatewayConfig.mode === 'primary') {
          dataSourceBase = gatewayConfig.primary.url;
          requiresToken = gatewayConfig.primary.requiresToken;
        } else if (gatewayConfig.mode === 'fallback') {
          dataSourceBase = gatewayConfig.fallback.url;
          requiresToken = gatewayConfig.fallback.requiresToken;
        }

        // If token is required but not provided - warn
        if (requiresToken && !userToken) {
          console.warn('Token required but not provided.');
        }

        // Display current mode for debugging
        console.log(`Gateway Mode: ${gatewayConfig.mode}`);
        console.log(`Data Source: ${dataSourceBase}`);
        console.log(`Requires Token: ${requiresToken}`);

      } catch (error) {
        console.error('Error loading configuration:', error);
        alert('Failed to load gateway configuration. Application cannot start.');
        return; // Stop execution if config fails
      }

      // Load data scripts dynamically
      try {
        // Check for Mixed Content (HTTPS page loading HTTP content)
        if (window.location.protocol === 'https:' && dataSourceBase.startsWith('http:')) {
          const msg = 'Security Error: Cannot load insecure (HTTP) data from a secure (HTTPS) page. Please use HTTP or update the server to HTTPS.';
          console.error(msg);
          alert(msg);
          return;
        }

        await loadDataScripts();
      } catch (error) {
        console.error('Error loading data scripts:', error);
        alert(`Failed to load data scripts: ${error.message}\nPlease check your connection or token.`);
      }
    }

    // Load data scripts based on configuration
    async function loadDataScripts() {
      // Build URLs with or without token
      let interviewStatsUrl, flightListUrl;
      let quotaDataUrl, invalidCasesUrl;

      if (requiresToken && userToken) {
        // Primary server with token
        interviewStatsUrl = `${dataSourceBase}/CAG_APS/interviews_count.js?token=${userToken}`;
        quotaDataUrl = `${dataSourceBase}/CAG_APS/quota_data.js?token=${userToken}`;
        // invalidCasesUrl = `${dataSourceBase}/CAG_AH/invalid_cases.js?token=${userToken}`;
      } else {
        // Fallback GitHub repository without token
        interviewStatsUrl = `${dataSourceBase}/CAG_APS/interviews_count.js`;
        quotaDataUrl = `${dataSourceBase}/CAG_APS/quota_data.js`;
        // invalidCasesUrl = `${dataSourceBase}/CAG_AH/invalid_cases.js`;
      }

      // Load remote data scripts
      try {
        console.log('Loading script:', interviewStatsUrl); // Keep console log
        // alert('Debug: Attempting to load script:\n' + interviewStatsUrl); // Uncomment for debugging if needed
        await loadScript(interviewStatsUrl);
        await loadScript(quotaDataUrl);
        // await loadScript(invalidCasesUrl);
        console.log('Remote data scripts loaded successfully');
      } catch (error) {
        console.error('Error loading remote data scripts:', error);
        throw error;
      }

      // Load logic scripts after data scripts are loaded
      try {
        await loadScript('scripts/PrepareData.js');
        await loadScript('scripts/CalculateData.js');
        console.log('Logic scripts loaded successfully');
      } catch (error) {
        console.error('Error loading logic scripts:', error);
        throw error;
      }

      // Load data scripts (with fallback to local if in fallback mode)
      try {
        if (gatewayConfig && gatewayConfig.mode === 'fallback') {
          console.log('Fallback mode active (scripts already loaded)');
        } else {
          // In primary mode, data files are already loaded from local files (lines 6-7)
          console.log('Using local data scripts');
        }
      } catch (error) {
        console.error('Error loading data scripts from fallback:', error);
        console.log('Falling back to local data scripts');
        // Local files will be used as they're already loaded in lines 6-7
      }

      dataReady = true;
      attemptDraw();
    }

    // Helper function to load a script dynamically
    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = url;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error(`Failed to load script: ${url}`));
        document.head.appendChild(script);
      });
    }

    // Initialize configuration on page load
    window.addEventListener('DOMContentLoaded', async () => {
      await loadConfiguration();
    });
  </script>

		<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">


   let chartsReady = false;
    let dataReady = false;

    google.charts.load('current', { 'packages': ['table', 'corechart', 'controls'] });
    google.charts.setOnLoadCallback(onChartsLoaded);

    function onChartsLoaded() {
      console.log('Google Charts loaded');
      chartsReady = true;
      attemptDraw();
    }

    function attemptDraw() {
      if (chartsReady && dataReady) {
        console.log('Both Charts and Data ready. Drawing table...');
        drawTable();
      } else {
        console.log(`Waiting... Charts: ${chartsReady}, Data: ${dataReady}`);
      }
    }
      function drawTable() {
        CalculateAirportAirLineReport();
        var data = new google.visualization.DataTable();

        //define header
        //data.addColumn('string', 'Date-Time');
        data.addColumn('string', 'Terminal');
        data.addColumn('string', 'Flight');
        data.addColumn('string', 'To');
        data.addColumn('string', 'Time');
        //data.addColumn('string', 'Airline-Airport');
        data.addColumn('string', 'DOOP');
        //data.addColumn('number', 'Remaining Flights');
        data.addColumn('number', 'Quota');
				data.addColumn('number', 'Missing');
        data.addColumn('number', 'Completed');
        data.addColumn('number', 'Completed %');
        data.addColumn('number', 'Priority Score');
        data.addColumn('number', 'Priority');
        
        //add data
        for (i = 0; i < daily_plan_data.length; i++) {
          var row = daily_plan_data[i];
          data.addRows([[
              row.DTerm, 
              row.Flight, 
              row.Dest,
              row.Date_Time, 
              //row.Airline + "-" + row.Dest,  
              row.doop, 
              //Number(row.remaining_flights), 
              Number(row.Quota), 
              Number(row.Difference), 
              Number(row.Completed), 
              Number(row.Completed_percent), 
              Number(row.Prioritisation_score), 
              Number(row.Priority)]]);
			  }	

        //highlight priority one
        var priority_col = data.getNumberOfColumns()-1; //last one
        for (var i = 0; i < data.getNumberOfRows(); i++) {
          for (j=0; j < data.getNumberOfColumns(); j++) {
            if (data.getValue(i, priority_col) ==1) 
            {
              data.setProperty(i, j, 'style', 'background-color:#FFCCCB');
            }
            else {
              //data.setProperty(i, j, 'style', 'background-color:white; font-size: 15px');
            }
          }
        }

        //create a dashboard.
        var dashboard = new google.visualization.Dashboard(
        document.getElementById('dashboard_div'));

        //create fiter
        var options = {
          //'allowHtml': true, 
          //'cssClassNames': {font: 'large' },
          'filterColumnLabel': 'Terminal',
          "ui": {"label": "Terminal", 
                "labelStacking": 'horizotal',
                "caption": "Select Terminal:",
                }
        };
        
        var tableFilter = new google.visualization.ControlWrapper({
          'controlType': 'CategoryFilter',
          'containerId': 'filter_div',
          'options': options
        });

        // Create table
        var tableChart = new google.visualization.ChartWrapper({
          'chartType': 'Table',
          'containerId': 'table_div',
          'options': {
            'allowHtml': true, 
            'cssClassNames': {tableCell: 'table-font', headerRow: 'table-font', headerCell: 'googleHeaderCell' },
            'sortColumn': 3, //time
            'showRowNumber': false, 'width': '100%', 'height': '100%'
          }
        });

        dashboard.bind(tableFilter, tableChart);

        var view = new google.visualization.DataView(data);
        view.hideColumns([priority_col, priority_col-1]); //unncessary columns: Date_Tome & priority
        //document.getElementById("filter_div").style.display = "none";
        dashboard.draw(view);

        //Update time info
        document.getElementById("download_time").innerHTML = "Data updated: " + download_time;

        //overall_status
        var overall_status = "Total quota: " + total_quota;
        overall_status += " - Total completed: " + total_completed;
        overall_status += " - In quota list completed: " + total_quota_completed;
        overall_status += " (" + total_completed_percent + "%)";
        document.getElementById("overall_status").innerHTML = overall_status;
      }
    </script>

    <h4 id="download_time"></h4>
    <div id="dashboard_div">
      <!--Divs that will hold each control and chart-->
      <div id="filter_div" style="font-size: 15px"> </div>
      </br>
      <div id="table_div"></div>
    </div>
